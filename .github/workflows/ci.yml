name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  packages:
    name: Packages (macOS ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [15, 26]
    runs-on: macos-${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          swift --version
      - name: Build and test packages
        run: |
          for package in Packages/FuenteText Packages/Grammars/TreeSitterPHP Packages/FuenteSyntax; do
            echo "::group::$package"
            (cd "$package" && swift build && swift test)
            echo "::endgroup::"
          done

  app:
    name: Fuente.app (macOS 26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app
        run: |
          xcodebuild -quiet -project Fuente.xcodeproj -scheme Fuente \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build

  dco:
    name: DCO
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        run: |
          missing=$(git log --format='%H %s%n%b' ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} \
            | awk 'BEGIN{RS="\n\n"} !/Signed-off-by:/ {print}' | head -20)
          if [ -n "$missing" ]; then echo "Commits without Signed-off-by:"; echo "$missing"; exit 1; fi
